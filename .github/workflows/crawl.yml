name: Cào tin & kiểm còn tuyển

# Vì sao GitHub Actions chứ không phải Vercel Cron hay pg_cron:
#
#   · Vercel Cron gọi vào một hàm serverless bị cắt sau vài chục giây, còn một
#     lượt cào vieclam24h mất ~12 phút.
#   · pg_cron trên Neon chỉ chạy khi compute còn thức. Gói Free ngủ sau vài
#     phút, nên job sẽ IM LẶNG không chạy — kiểu hỏng tệ nhất.
#
# Xem docs/deploy.md §0.

on:
  schedule:
    # Bốn lần một ngày: chỉ VietnamWorks (API, nhanh) + kiểm còn-sống.
    # Giờ UTC, Việt Nam là UTC+7 -> 08:00, 14:00, 20:00, 02:00 giờ Việt Nam.
    - cron: '0 1,7,13,19 * * *'
    # Một lần một ngày, thêm vieclam24h (chậm hơn nhiều vì phải tải từng trang).
    # 18:30 UTC = 01:30 giờ Việt Nam, lúc sàn vắng người nhất.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Nguồn cần cào, cách nhau bằng dấu phẩy'
        default: 'vnw'
      limit:
        description: 'Trần số tin mỗi nguồn'
        default: '800'

# Hai lượt cào chồng nhau sẽ cùng ghi vào một bảng và cùng gõ cửa một sàn.
# Xếp hàng, không huỷ lượt đang chạy giữa chừng.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Trần cứng: một lượt treo không được phép ăn hết phút miễn phí của tháng.
    #
    # 45 chứ không phải 30 vì lượt chạy NẶNG hằng ngày (18:30 UTC) nay có thêm
    # CareerViet. Cộng theo số đo thật 09/09: vieclam24h ~20 phút + CareerViet
    # ~6 phút + vnw ~10 phút + npm ci và seed ~2 phút ≈ 38 phút. 30 phút là
    # chạm trần và bị cắt giữa chừng; 45 để lại khoảng thở mà vẫn chặn được
    # lượt treo. Bốn lượt NHẸ còn lại chỉ khoảng 10 phút nên không đụng tới.
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
      CRAWLER_BOT_NAME: BaeJobBot
      # Tỷ giá quy USD -> VND. KHÔNG phải bí mật nên để ở Variables, không phải
      # Secrets (Settings -> Secrets and variables -> Actions -> Variables).
      #
      # Trước đây workflow không truyền hai biến này, nên lượt cào trên runner
      # âm thầm dùng mức dự phòng cài cứng 25.400 trong salary.ts, còn máy ở
      # nhà dùng mức trong .env. Cùng một tin ITviec khai lương USD sẽ ra hai
      # con số VND khác nhau tuỳ chỗ chạy — sai lệch im lặng, không ai thấy.
      #
      # ⚠️ Variable CHƯA khai thì GitHub truyền CHUỖI RỖNG, không phải "không
      #    có biến". Câu cũ ở đây ("rơi về mức dự phòng, không hỏng gì") SAI:
      #    salary.ts khi ấy đọc `Number('' ?? 25_400)` = 0, và đo 17/09/2026
      #    có 172 tin USD cào trên runner mang tỷ giá 0, lương 0 đồng, lọt vào
      #    trung vị. salary.ts nay chỉ nhận số dương, còn lại mới dùng 25.400 —
      #    nhưng vẫn NÊN khai Variable để tỷ giá không phải con số cài cứng.
      USD_VND_RATE: ${{ vars.USD_VND_RATE }}
      USD_VND_RATE_DATE: ${{ vars.USD_VND_RATE_DATE }}
      # ⚠️ Ổ đĩa của runner bị xoá sau mỗi lượt, nên KHÔNG dùng driver "fs" ở
      #    đây: blob sẽ mất mà `rawKey` vẫn nằm lại trong CSDL, tạo ra con trỏ
      #    chết và `npm run reparse` sẽ báo "thiếu blob" mãi mãi.
      #    Khai đủ ba biến R2_* trong repo secrets thì tự chuyển sang R2 và giữ
      #    được blob; chưa khai thì dùng kho rỗng — tin vẫn vào CSDL đầy đủ,
      #    chỉ là không có bản thô để tính lại. Crawler ghi rawKey = NULL cho
      #    những tin đó, tức là nói thật thay vì để lại con trỏ hỏng.
      BLOB_DRIVER: ${{ secrets.R2_ACCOUNT_ID != '' && 'r2' || 'null' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      # ⚠️ PHẢI đứng trước mọi bước tốn thời gian.
      #
      # Vì sao có bước này: khi secret chưa khai, lượt chạy vẫn đi hết checkout
      # → setup-node → npm ci → prisma generate (khoảng 40 giây) rồi mới chết ở
      # `db:seed` với thông báo của Prisma là "You must provide a nonempty URL.
      # The environment variable DATABASE_URL resolved to an empty string" —
      # nằm lọt giữa 300 dòng log và một vệt stack trace, không nói một chữ nào
      # về GitHub Secrets. Đã mất năm lượt chạy đỏ liên tiếp mới truy ra.
      #
      # Kiểm ở đây thì hỏng trong 5 giây và thông báo nói thẳng phải làm gì.
      - name: Kiểm secret bắt buộc
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$CRAWLER_CONTACT_EMAIL" ] && missing="$missing CRAWLER_CONTACT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error title=Thiếu GitHub Secret::Chưa khai:$missing"
            echo ""
            echo "Khai tại: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "  DATABASE_URL           chuỗi kết nối Neon, giống hệt trong .env dưới máy"
            echo "  CRAWLER_CONTACT_EMAIL  email liên hệ, bắt buộc vì User-Agent phải liên hệ được"
            echo ""
            echo "Không có DATABASE_URL thì db:seed chết ngay; không có"
            echo "CRAWLER_CONTACT_EMAIL thì buildUserAgent() ném lỗi ở bước cào."
            exit 1
          fi
          echo "✓ Đủ secret bắt buộc."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sinh Prisma Client
        run: npx prisma generate

      - name: Nạp nguồn và ngành
        # Chạy được nhiều lần không hỏng, và là thứ bảo đảm cấu hình nhắm mục
        # tiêu trong mã nguồn luôn khớp với cấu hình trong CSDL.
        run: npm run db:seed

      - name: Cào VietnamWorks
        run: npm run crawl -- --source ${{ inputs.sources || 'vnw' }} --full --limit ${{ inputs.limit || 800 }}

      - name: Cào vieclam24h (một lần mỗi ngày)
        if: github.event.schedule == '30 18 * * *'
        run: npm run crawl -- --source vieclam24h --full --limit 400

      # CareerViet là nguồn lớn thứ hai sau VietnamWorks trong phạm vi ngành
      # (đo 09/09: 134 tin thuộc phạm vi, so với vnw 764) và là nguồn khai giờ
      # làm việc nhiều nhất, tức cột "lịch thứ 7" chỉ có dữ liệu thật nhờ nó.
      #
      # Trần 100 chứ không phải 250 vì ngân sách THỜI GIAN, không phải vì nguồn
      # yếu: đo thật 09/09 là 3,3 giây/URL (250 trang mất 13,9 phút, 377 MB —
      # trang chi tiết của họ nặng ~1,5 MB). 100 trang ≈ 6 phút, vừa với lượt
      # chạy nặng hằng ngày mà không đụng trần `timeout-minutes`.
      - name: Cào CareerViet (một lần mỗi ngày)
        if: github.event.schedule == '30 18 * * *'
        run: npm run crawl -- --source careerviet --full --limit 100

      # CỐ Ý CHƯA đưa timviec365 vào lịch, dù nguồn chạy tốt. Hai lý do đo được:
      #
      #  1. CHẬM: 167 URL mất 63,6 phút (≈23 giây/URL, gấp bảy lần CareerViet).
      #     Chỉ riêng nó đã ăn hết trần thời gian của cả lượt chạy.
      #  2. LỢI ÍCH THẤP lúc này: `datePosted` của sàn là ngày đăng LẦN ĐẦU chứ
      #     không phải ngày gia hạn, nên bộ lọc `maxAgeDays: 90` của ngành loại
      #     gần hết — đo 09/09 chỉ 1/117 tin lọt vào phạm vi trang Ngành.
      #
      # Muốn bật: nới `maxAgeDays` trong SavedFilter trước (nếu không thì cào
      # về rồi lọc bỏ), rồi thêm bước với trần thấp, ví dụ `--limit 40`.

      - name: Kiểm tin còn tuyển
        # Chỉ kiểm tin thuộc ngành đang quan tâm — vài chục request thay vì vài
        # nghìn. Ba cái van trong scripts/recheck.ts lo phần còn lại.
        run: npm run recheck -- --filter thu-mua-hcm

      - name: Sức khoẻ dữ liệu
        # Luôn chạy, kể cả khi bước trên hỏng: khi crawler vỡ thì đây đúng là
        # lúc cần nhìn số liệu nhất.
        if: always()
        run: npm run db:inspect
