name: Cào tin & kiểm còn tuyển — Ngành của tôi (swe)

# Lượt cào của workspace **swe** (Ngành của tôi, phần mềm).
#
# Từ 28/09/2026: MỖI NGUỒN MỘT JOB, chạy song song, không đặt trần số tin cho
# các sàn Việt Nam. Trước đó các nguồn chạy nối đuôi nhau trong một tiến trình
# (`runCrawl` duyệt `for (const source of sources)`), nên tổng thời gian là
# tổng của mọi nguồn và một sàn chậm chặn hết phần còn lại.
#
# Vì sao song song KHÔNG phá lời hứa lịch sự: `MIN_DELAY_MS` là nghỉ giữa hai
# request TỚI CÙNG MỘT HOST (constants/crawl §MAX_CONCURRENT_PER_HOST). Mỗi
# job ở đây là một host khác nhau, nên mỗi host vẫn có đúng một tiến trình xếp
# hàng. Hai workspace vẫn dùng chung nhóm concurrency để bae và swe không cùng
# lúc gõ vào ITviec.
#
# Xem docs/plan-swe.md §10, docs/deploy.md §0.

on:
  schedule:
    # Giờ UTC; Việt Nam là UTC+7 → 11:20, 17:20, 23:20 và 04:50 giờ Việt Nam.
    # Giờ nào cũng cào ĐỦ mọi nguồn — không còn lượt "nhẹ"/"nặng", vì khi các
    # nguồn chạy song song thì thêm một sàn không kéo dài lượt chạy.
    - cron: '20 4,10,16 * * *'
    - cron: '50 21 * * *'
  # Bấm tay: để trống ô "sources" là cào đủ mọi nguồn như lịch.
  workflow_dispatch:
    inputs:
      sources:
        description: 'Chỉ cào vài nguồn (cách nhau bằng dấu phẩy); để trống = tất cả'
        default: ''
      limit:
        description: 'Trần số tin mỗi nguồn (chỉ khi bấm tay); để trống = như lịch'
        default: ''

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  BJ_WORKSPACE: swe
  DATABASE_URL_SWE: ${{ secrets.DATABASE_URL_SWE }}
  # CSDL của Bae có mặt KHÔNG phải để dùng — `loadEnv()` luôn ghi đè
  # DATABASE_URL bằng chuỗi của workspace đang chọn. Nó là CHỨNG CỨ cho chốt
  # `assertDistinctDatabases`: dán nhầm chuỗi của Bae vào DATABASE_URL_SWE là
  # kiểu hỏng tệ nhất, và chốt chỉ thấy được khi nhìn CẢ HAI chuỗi.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
  CRAWLER_BOT_NAME: BaeJobBot
  USD_VND_RATE: ${{ vars.USD_VND_RATE }}
  USD_VND_RATE_DATE: ${{ vars.USD_VND_RATE_DATE }}
  BLOB_DRIVER: ${{ secrets.R2_ACCOUNT_ID != '' && 'r2' || 'null' }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  # Trần số FILE SITEMAP đọc mỗi nguồn mỗi lượt (mặc định trong mã nguồn là 50).
  # TopDev có 257 file, Glints 66 — với mức 50 thì mỗi lượt chỉ thấy phần mới
  # nhất của hai sàn đó. Nâng lên để "mọi nguồn" nghĩa là cả kho, không phải
  # cả kho của vài sàn.
  CRAWL_MAX_PAGES_PER_SOURCE: '300'

jobs:
  # ── 1. Nạp cấu hình MỘT LẦN ────────────────────────────────────────────────
  # Tách khỏi ma trận vì 12 job cùng chạy `db:seed` là 12 lượt ghi đè nhau vào
  # cùng những dòng Source/Skill — vô nghĩa và dễ khoá nhau.
  chuan-bi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # PHẢI đứng trước mọi bước tốn thời gian — thiếu secret mà không kiểm ở
      # đây thì lượt chạy đi hết 40 giây rồi mới chết bằng một câu của Prisma
      # không nhắc một chữ nào tới GitHub Secrets.
      - name: Kiểm secret bắt buộc
        run: |
          missing=""
          [ -z "$DATABASE_URL_SWE" ] && missing="$missing DATABASE_URL_SWE"
          [ -z "$CRAWLER_CONTACT_EMAIL" ] && missing="$missing CRAWLER_CONTACT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error title=Thiếu GitHub Secret::Chưa khai:$missing"
            echo ""
            echo "Khai tại: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "  DATABASE_URL_SWE       chuỗi kết nối Neon của CSDL 'Ngành của tôi'"
            echo "                         (KHÁC DATABASE_URL — đó là CSDL của Bae)"
            echo "  CRAWLER_CONTACT_EMAIL  email liên hệ, bắt buộc vì User-Agent phải liên hệ được"
            exit 1
          fi
          if [ -n "$DATABASE_URL" ] && [ "$DATABASE_URL" = "$DATABASE_URL_SWE" ]; then
            echo "::error title=Hai workspace trỏ cùng CSDL::DATABASE_URL_SWE đang mang đúng chuỗi của DATABASE_URL (CSDL của Bae). Tạo Neon project riêng cho workspace swe — xem docs/plan-swe.md §7."
            exit 1
          fi
          echo "✓ Đủ secret bắt buộc, và hai chuỗi kết nối khác nhau."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Nạp nguồn, ngành và danh mục kỹ năng
        # Chạy nhiều lần không hỏng, KHÔNG ghi đè từ điển ngành đã chỉnh bằng
        # SQL (seed chỉ ghi đè khi có cờ --force), và là chỗ DUY NHẤT nạp bảng
        # `Skill` — không có nó thì cào về mà không bóc được kỹ năng nào.
        run: npm run db:seed

  # ── 2. Mỗi nguồn một job, chạy cùng lúc ────────────────────────────────────
  cao:
    needs: chuan-bi
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.phut }}
    strategy:
      # KHÔNG huỷ các nguồn còn lại khi một nguồn hỏng. Một sàn đổi HTML là
      # chuyện của sàn đó; tám sàn kia vẫn phải mang tin về.
      fail-fast: false
      # 12 nguồn, 12 host khác nhau → mỗi host vẫn đúng một tiến trình.
      max-parallel: 12
      matrix:
        include:
          # ── Sàn Việt Nam: KHÔNG giới hạn số tin ────────────────────────────
          # `--limit 5000` ở đây là trần AN TOÀN, không phải trần dữ liệu: số
          # tin thuộc phạm vi đo được của sàn lớn nhất là 260 (ITviec), nên
          # 5.000 nghĩa là "lấy hết những gì lọt bộ lọc". Để trống thì mã nguồn
          # tự áp mặc định 300 (MAX_DETAIL_PAGES_PER_SOURCE) — tức VẪN là một
          # cái trần, chỉ là cái trần không ai thấy.
          - nguon: vnw
            phut: 30
          - nguon: itviec
            phut: 45
          - nguon: careerviet
            phut: 60
          - nguon: vieclam24h
            phut: 60
          - nguon: glints
            phut: 45
          - nguon: topdev
            phut: 45
          # 23 giây/URL (đo 09/09) — chậm gấp bảy lần CareerViet. Trước đây bị
          # loại khỏi lịch vì một mình nó ăn hết trần thời gian của cả lượt;
          # nay nó có job riêng nên không cản ai.
          - nguon: timviec365
            phut: 120
          # Hai sàn bật lại 28/09 theo yêu cầu "mọi nguồn" — xem targeting.ts.
          - nguon: iconicjob
            phut: 45
          # Kho 195.000 URL, lọc ở tầng sitemap nên cái giá là thời gian khám
          # phá chứ không phải băng thông.
          - nguon: vieclamnhamay
            phut: 90
          # ── Sàn remote quốc tế: PHẢI có trần ───────────────────────────────
          # Kho của chúng là 15.000–420.000 URL. Không trần nghĩa là vài chục
          # nghìn request mỗi lượt, tức lượt chạy không bao giờ kết thúc và lần
          # sau lại bắt đầu từ đúng chỗ cũ — tệ hơn là có trần. `maxUrls` của
          # generic-jsonld là `maxDetailPages × 3`, nên trần này cắt luôn phần
          # khám phá.
          - nguon: remoteok
            phut: 45
            tran: 400
          - nguon: nodesk
            phut: 45
            tran: 400
          - nguon: workingnomads
            phut: 45
            tran: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Cào ${{ matrix.nguon }}
        run: npm run crawl -- --source ${{ matrix.nguon }} --full --limit ${{ inputs.limit || matrix.tran || 5000 }}
        # Chỉ chạy nguồn được chọn khi bấm tay; để trống ô đó là chạy tất.
        if: ${{ inputs.sources == '' || contains(format(',{0},', inputs.sources), format(',{0},', matrix.nguon)) }}

  # ── 3. Gom lại: kiểm tin còn tuyển và báo cáo ──────────────────────────────
  # Chạy SAU ma trận, không song song với nó: `recheck` gọi HTTP vào chính
  # những host đang cào, nên chạy cùng lúc là hai tiến trình một host.
  kiem-va-bao-cao:
    needs: cao
    # Kể cả khi vài nguồn hỏng — lúc crawler vỡ mới là lúc cần nhìn số liệu nhất.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Kiểm tin còn tuyển
        # Chỉ kiểm tin thuộc ngành phần mềm — vài chục request thay vì vài
        # nghìn. Ba cái van trong scripts/recheck.ts lo phần còn lại.
        run: npm run recheck -- --filter phan-mem-hcm

      - name: Sức khoẻ dữ liệu
        if: always()
        run: npm run db:inspect

      # Cào thêm để LÀM GÌ — câu trả lời phải nhìn thấy mà không phải mở log.
      # `match` không ghi gì, chỉ chấm lại toàn kho và in số tin theo mức hợp
      # CV. Đích N1 của plan-swe là ≥ 60 tin mức "Hợp" trở lên.
      - name: Độ hợp CV — ghi vào trang tóm tắt
        if: always()
        continue-on-error: true
        run: |
          {
            echo '### Ngành của tôi — sau lượt cào'
            echo ''
            echo '```'
            npm run match --silent -- --sample 0 2>&1 | awk '/Kết quả chấm/{on=1} /^── /{on=0} on'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
